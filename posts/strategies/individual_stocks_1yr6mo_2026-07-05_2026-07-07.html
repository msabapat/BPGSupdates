<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Options on Individual Stocks</title>
<style>
  * { box-sizing:border-box }
  body { background:#f8fafc; color:#1e293b; font-family:'Consolas','Courier New',monospace; margin:0; padding:16px }
  h1 { font-size:16px; color:#0f172a; margin:0 0 4px 0 }
  .subtitle { color:#64748b; font-size:11px; margin-bottom:14px }
  .otabs { display:flex; gap:6px; border-bottom:2px solid #4f46e5; flex-wrap:wrap }
  .otab { background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe; border-bottom:none;
           border-radius:7px 7px 0 0; padding:9px 20px; font-family:inherit; font-size:14px; cursor:pointer }
  .otab:hover { background:#e0e7ff }
  .otab.active { background:#4f46e5; color:#fff; border-color:#4f46e5; font-weight:bold }
  .otab .sub { font-size:10px; font-weight:normal; opacity:.8 }
  .opanel { display:none } .opanel.active { display:block }
  .itabs { display:flex; gap:4px; margin:10px 0 0 0; flex-wrap:wrap }
  .itab { background:#f1f5f9; color:#64748b; border:1px solid #cbd5e1;
           border-radius:5px; padding:6px 14px; font-family:inherit; font-size:12px; cursor:pointer }
  .itab:hover { background:#e2e8f0; color:#1e293b }
  .itab.active { background:#ffffff; color:#0f172a; border-color:#4f46e5; font-weight:bold }
  .ipanel { display:none } .ipanel.active { display:block }
  .frame { width:100%; height:calc(100vh - 130px); border:1px solid #cbd5e1;
            border-radius:6px; background:#ffffff; margin-top:8px }
</style></head>
<body>

<script>
function loadFrame(o, i) {
  var f = document.getElementById('frame-' + o + '-' + i);
  if (f && !f.src) { f.src = f.dataset.src; }   // lazy: fetch only on first activation
}
function showInner(o, i) {
  document.querySelectorAll('#opanel-' + o + ' .itab').forEach(function(b){ b.classList.toggle('active', b.dataset.i == i); });
  document.querySelectorAll('#opanel-' + o + ' .ipanel').forEach(function(p, idx){ p.classList.toggle('active', idx == i); });
  loadFrame(o, i);
}
function showOuter(o) {
  document.querySelectorAll('.otab').forEach(function(b){ b.classList.toggle('active', b.dataset.o == o); });
  document.querySelectorAll('.opanel').forEach(function(p, idx){ p.classList.toggle('active', idx == o); });
  var active = document.querySelector('#opanel-' + o + ' .itab.active');
  loadFrame(o, active ? active.dataset.i : 0);
}
loadFrame(0, 0);
</script>
